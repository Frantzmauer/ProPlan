<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Nawyk zapisywania ŻELAZO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Układ: jedna kolumna jak w aplikacji ŻELAZO (telefon); u góry przełącznik ekranów prototypu.
   Kolory i kroje z aplikacji — tylko ciemny motyw, jak sama aplikacja. Godziny = główny materiał tego ekranu. */
:root{
  --bg:#0e1114; --panel:#171b1f; --panel2:#1e2429; --line:#2a3138;
  --ink:#f2f0ea; --dim:#9aa3ab; --faint:#7d8790;
  --amber:#ff7a1a; --amber-soft:#3a2410; --steel:#5fa8d3; --green:#4ec97e; --red:#e2543a; --gold:#ffc94a; --plum:#c58bd6;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14.5px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
h1{font-family:var(--disp);font-size:30px;line-height:1;margin:2px 0 0;text-transform:uppercase}
h2{font-family:var(--disp);font-size:22px;margin:0;text-transform:uppercase;text-wrap:balance}
.dim{color:var(--dim)}.small{font-size:12.5px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:9px 2px;font-weight:600;font-size:13px;color:var(--dim)}
.tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.btn{background:var(--amber);color:#14100c;border:0;border-radius:11px;padding:12px 14px;font-family:var(--disp);font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 11px;font-size:14px}
.meal{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:none;padding:0}
.chk.on{background:var(--amber);border-color:var(--amber);color:#14100c;font-weight:700}
.meal .t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.meal .d{font-size:14px}
.meal .k{font-size:12.5px;color:var(--dim)}
.stamp{display:inline-flex;gap:6px;align-items:center;font-size:12px;border-radius:999px;padding:3px 9px;margin-top:4px;font-variant-numeric:tabular-nums}
.stamp.now{background:rgba(78,201,126,.12);color:var(--green)}
.stamp.late{background:rgba(255,201,74,.1);color:var(--gold)}
.stamp.eve{background:rgba(226,84,58,.12);color:var(--red)}
.add{display:flex;gap:8px}.add .btn{flex:1}
.ask{border:1px solid var(--amber);background:var(--amber-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ask .chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px}
.chips button.on{border-color:var(--amber);background:var(--amber-soft)}
.notif{background:#22282e;border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:36px 1fr;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.notif .ic{width:36px;height:36px;border-radius:9px;background:var(--amber);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#14100c}
.notif b{display:block;font-size:14px}.notif span{font-size:13px;color:var(--dim)}
.notif .acts{grid-column:2;display:flex;gap:8px;margin-top:6px}
.notif .acts button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.photo{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--panel2);display:grid;place-items:center}
.photo img,.photo canvas{width:100%;height:100%;object-fit:cover;display:block}
.photo .scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0,rgba(255,122,26,.25) 50%,transparent 100%);background-size:100% 40%;background-repeat:no-repeat;animation:scan 1.2s linear infinite}
@keyframes scan{from{background-position:0 -40%}to{background-position:0 140%}}
@media (prefers-reduced-motion:reduce){.photo .scan{animation:none}}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel2);border-radius:10px;padding:10px 12px}
.item b{font-size:14px}.item .g{font-size:12.5px;color:var(--dim)}
.item .kc{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums}
.item input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--amber)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.sum div{background:var(--panel2);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}.sum span{font-size:11.5px;color:var(--dim)}
.conf{font-size:12.5px;color:var(--dim)}.conf b{color:var(--gold)}
.slot{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .chips button{flex:1 1 auto}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kpi b{display:block;font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--dim);line-height:1.3;display:block}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:10px;fill:var(--faint)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.insight{font-size:13.5px;color:var(--dim);line-height:1.5;padding-left:12px;border-left:2px solid var(--line)}
.insight b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;width:max-content;max-width:calc(100% - 32px);display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.proto{font-size:12px;color:var(--faint);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
</style>

<div class="wrap">
  <div>
    <div class="eyebrow">Prototyp · Dieta</div>
    <h1>Nawyk zapisywania</h1>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="day" class="on" id="t-day">Dzień</button>
    <button role="tab" data-tab="photo" id="t-photo">Zdjęcie</button>
    <button role="tab" data-tab="eve" id="t-eve">Wieczór</button>
    <button role="tab" data-tab="stats" id="t-stats">Nawyki</button>
  </div>
  <div id="view"></div>
  <div class="proto">Prototyp na przykładowych danych. Wynik ze zdjęcia jest tu przykładowy — w aplikacji policzy go AI z Twojego zdjęcia.</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const NOW=14*60+52;   // w prototypie jest 14:52
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const SLOTS=[
  {k:'m0', t:'Śniadanie', d:'Owsianka z odżywką, jabłko, orzechy', kcal:520, usual:7*60+40},
  {k:'m1', t:'Przekąska', d:'Skyr z owocami jagodowymi', kcal:240, usual:10*60+30},
  {k:'m2', t:'Obiad', d:'Pierś z kurczaka, ryż, warzywa', kcal:690, usual:13*60+50},
  {k:'m3', t:'Kolacja', d:'Jajecznica z 3 jaj, pieczywo, pomidor', kcal:480, usual:19*60+10}
];
// odhaczenie: o której zapisano i (jeśli później) o której zjedzono
let DAY={m0:{logged:7*60+55, ate:7*60+40}, m1:{logged:13*60+20, ate:10*60+30}, extra:[]};
let tab='day', askFor=null, photoStage='pick', photoUrl=null, items=null, eve={};

function stamp(x){
  if(!x) return '';
  const lag=x.logged-x.ate;
  if(lag<=45) return `<span class="stamp now">✓ zapisane ${hm(x.logged)} · na bieżąco</span>`;
  if(x.logged>=20*60+30) return `<span class="stamp eve">✓ zjedzone ${hm(x.ate)} · uzupełnione wieczorem</span>`;
  return `<span class="stamp late">✓ zjedzone ${hm(x.ate)} · zapisane ${hm(x.logged)}</span>`;
}

function viewDay(){
  const due=SLOTS.find(s=>!DAY[s.k] && NOW>=s.usual+40 && NOW<s.usual+180);
  return `${due?`<div class="notif" role="status"><div class="ic">Ż</div><div><b>${due.t}? (${hm(due.usual)})</b><span>Zwykle jesz go około tej pory. Zapisz teraz — zajmie 2 sekundy.</span></div>
      <div class="acts"><button type="button" data-quick="${due.k}">Wg planu</button><button type="button" data-tab2="photo">📷 Zdjęcie</button><button type="button" data-snooze>Później</button></div></div>
      <div class="small dim">↑ powiadomienie ~40 min po Twojej zwykłej porze posiłku (z Twoich zapisów), nie o stałej godzinie</div>`:''}
    <div class="card"><div class="sec">Dziś · ${hm(NOW)}</div>
    ${SLOTS.map(s=>{ const x=DAY[s.k];
      return `<div class="meal"><button class="chk ${x?'on':''}" type="button" data-meal="${s.k}" aria-pressed="${!!x}" aria-label="${s.t}">${x?'✓':''}</button>
        <div><div class="t">${s.t}</div><div class="d">${s.d}</div><div class="k">${s.kcal} kcal</div>${stamp(x)}
        ${askFor===s.k?`<div class="ask"><b>O której był ten posiłek?</b><div class="chips">${[0,30,60].map(m=>`<button type="button" data-ate="${NOW-m}">${m===0?'teraz':hm(NOW-m)}</button>`).join('')}<button type="button" data-ate="${s.usual}">jak zwykle (${hm(s.usual)})</button></div>
          <span class="small dim">Pytamy tylko, gdy zapisujesz ponad 45 min po zwykłej porze — dzięki temu widać, kiedy naprawdę jesz.</span></div>`:''}</div></div>`; }).join('')}
    ${DAY.extra.map(e=>`<div class="meal"><button class="chk on" type="button" disabled aria-label="Dodany">✓</button><div><div class="t" style="color:var(--steel)">Ze zdjęcia</div><div class="d">${e.d}</div><div class="k">${e.kcal} kcal · B ${e.p} / W ${e.c} / T ${e.f}</div>${stamp(e)}</div></div>`).join('')}
    <div class="add"><button class="btn ghost sm" type="button">＋ Dodaj posiłek</button><button class="btn sm" type="button" data-tab2="photo">📷 Zdjęcie posiłku</button></div></div>`;
}

const SAMPLE=[
  {n:'Makaron penne (ugotowany)', g:220, kcal:290, p:10, c:58, f:2},
  {n:'Sos pomidorowy z mięsem mielonym', g:180, kcal:310, p:19, c:12, f:20},
  {n:'Parmezan', g:15, kcal:60, p:5, c:0, f:4},
  {n:'Oliwa (na oko, do smażenia)', g:10, kcal:90, p:0, c:0, f:10}
];
function photoSum(){ return items.reduce((a,x)=>{ const f=x.g/x.g0; a.kcal+=x.kcal*f; a.p+=x.p*f; a.c+=x.c*f; a.f+=x.f*f; return a; },{kcal:0,p:0,c:0,f:0}); }
function drawPlate(c){
  const x=c.getContext('2d'), w=c.width, h=c.height;
  x.fillStyle='#3a2e24'; x.fillRect(0,0,w,h);
  x.fillStyle='#e8e4dc'; x.beginPath(); x.ellipse(w/2,h/2,w*.36,h*.4,0,0,7); x.fill();
  x.fillStyle='#e9c46a'; for(let i=0;i<70;i++){ const a=Math.random()*6.28, r=Math.random()*w*.22; x.save(); x.translate(w/2+Math.cos(a)*r, h/2+Math.sin(a)*r*.9); x.rotate(Math.random()*3); x.fillRect(-9,-3,18,6); x.restore(); }
  x.fillStyle='#b5442f'; x.beginPath(); x.ellipse(w/2+10,h/2-6,w*.15,h*.14,0,0,7); x.fill();
  x.fillStyle='#f4efe0'; for(let i=0;i<25;i++){ x.fillRect(w/2-30+Math.random()*80, h/2-30+Math.random()*50, 3, 3); }
}
function viewPhoto(){
  if(photoStage==='pick') return `<div class="card"><div class="sec">Zdjęcie posiłku</div>
      <div class="photo" aria-hidden="true"><span style="font-size:52px">📷</span></div>
      <label class="btn" style="text-align:center" for="pic">Zrób zdjęcie</label>
      <input id="pic" type="file" accept="image/*" capture="environment" hidden>
      <button class="btn ghost" type="button" id="sample">Użyj przykładowego zdjęcia</button>
      <div class="small dim">Najlepiej z góry, cały talerz w kadrze. Do AI idzie jedno pomniejszone zdjęcie; nie zostaje na serwerze. Liczy się jako 1 szacowanie z limitu.</div></div>`;
  if(photoStage==='busy') return `<div class="card"><div class="sec">Szacuję…</div><div class="photo">${photoUrl?`<img src="${photoUrl}" alt="Zdjęcie posiłku">`:'<canvas id="cv" width="480" height="360"></canvas>'}<div class="scan"></div></div><div class="small dim">AI rozpoznaje składniki i szacuje porcje (zwykle 5–10 s).</div></div>`;
  const s=photoSum();
  return `<div class="card"><div class="sec">Rozpoznane składniki</div>
    <div class="photo" style="aspect-ratio:16/9">${photoUrl?`<img src="${photoUrl}" alt="Zdjęcie posiłku">`:'<canvas id="cv" width="480" height="270"></canvas>'}</div>
    <div class="conf">Pewność: <b>średnia</b> — oliwy i sosu nie widać dokładnie. Popraw porcje suwakami, jeśli wiesz lepiej.</div>
    <div class="items">${items.map((x,i)=>`<div class="item"><b>${x.n}</b><span class="kc">${Math.round(x.kcal*x.g/x.g0)}</span><span class="g">${x.g} g</span>
      <input type="range" min="${Math.round(x.g0*.3)}" max="${Math.round(x.g0*2)}" step="5" value="${x.g}" data-it="${i}" aria-label="Porcja: ${x.n}"></div>`).join('')}</div>
    <div class="sum"><div><b>${Math.round(s.kcal)}</b><span>kcal</span></div><div><b>${Math.round(s.p)}</b><span>białko</span></div><div><b>${Math.round(s.c)}</b><span>węgle</span></div><div><b>${Math.round(s.f)}</b><span>tłuszcz</span></div></div>
    <button class="btn" type="button" id="use">Dodaj do dnia · ${Math.round(s.kcal)} kcal</button>
    <button class="btn ghost" type="button" id="again">Inne zdjęcie</button></div>`;
}

const EVE_MISSING=['m2','m3'];
function viewEve(){
  return `<div class="notif" role="status"><div class="ic">Ż</div><div><b>Brakuje 2 posiłków (21:30)</b><span>Domknij dzień — bez tego trend wagi i kalorie liczą się z dziur.</span></div></div>
    <div class="small dim">↑ tylko gdy dzień ma luki. Pełny dzień zapisany na bieżąco = brak wieczornego przypomnienia.</div>
    <div class="card"><div class="sec">Domknij dzień · 21:30</div>
    ${EVE_MISSING.map(k=>{ const s=SLOTS.find(x=>x.k===k), v=eve[k];
      return `<div class="slot"><b>${s.t} <span class="dim small">· zwykle ${hm(s.usual)}</span></b>
        <div class="chips">${[['plan','Wg planu'],['other','Inaczej'],['skip','Pominięty']].map(([o,l])=>`<button type="button" data-eve="${k}" data-o="${o}" class="${v===o?'on':''}">${l}</button>`).join('')}</div>
        ${v==='other'?`<div class="chips"><button type="button">🎤 Powiedz</button><button type="button" data-tab2="photo">📷 Zdjęcie</button><button type="button">✍️ Wpisz</button></div>`:''}</div>`; }).join('')}
    <button class="btn" type="button" id="eveDone" ${EVE_MISSING.every(k=>eve[k])?'':'disabled style="opacity:.5"'}>Zapisz dzień</button>
    <div class="small dim">Uzupełnione wieczorem liczą się do kalorii, ale nie do serii „na bieżąco”. Nie ma tu przycisku „cały dzień wg planu” — każdy posiłek trzeba potwierdzić osobno.</div></div>`;
}

// 7 dni przykładowych zapisów: [posiłek, zjedzone, zapisane]
const WEEK=[
  ['Pn',[[7.6,7.7],[10.5,10.6],[13.8,14.0],[19.3,19.4]]],
  ['Wt',[[7.7,7.8],[10.4,21.6],[14.2,21.6],[19.1,21.6]]],
  ['Śr',[[7.5,7.6],[10.6,10.7],[13.9,14.1],[20.4,20.5]]],
  ['Cz',[[7.8,8.0],[11.0,11.1],[14.5,21.9],[21.6,21.9]]],
  ['Pt',[[7.6,7.7],[null,null],[15.2,15.3],[22.4,22.5]]],
  ['Sb',[[9.8,22.8],[null,null],[14.6,22.8],[21.9,22.8]]],
  ['Nd',[[9.5,9.6],[null,null],[14.0,14.2],[19.4,19.5]]]
];
function viewStats(){
  const all=WEEK.flatMap(([,m])=>m).filter(x=>x[0]!=null), onTime=all.filter(x=>x[1]-x[0]<=.75).length;
  const lagAvg=all.reduce((a,x)=>a+(x[1]-x[0]),0)/all.length, late=all.filter(x=>x[0]>=21).length;
  const W=340,H=210,L=26,R=8,T=12,B=22, y0=6, y1=24, Y=h=>T+(h-y0)/(y1-y0)*(H-T-B), X=i=>L+(i+.5)*(W-L-R)/7;
  let g='';
  [6,9,12,15,18,21,24].forEach(h=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--line)"/><text x="${L-4}" y="${Y(h)+3.5}" text-anchor="end">${h}</text>`; });
  g+=`<rect x="${L}" y="${Y(21)}" width="${W-L-R}" height="${Y(24)-Y(21)}" fill="var(--red)" opacity=".07"/>`;
  WEEK.forEach(([d,m],i)=>{
    g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${d}</text>`;
    m.forEach(x=>{ if(x[0]==null) return; const lag=x[1]-x[0], col=lag<=.75?'var(--green)':x[1]>=20.5?'var(--red)':'var(--gold)';
      if(lag>.75) g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(x[0])}" y2="${Y(x[1])}" stroke="${col}" stroke-dasharray="2 3" opacity=".7"/><circle cx="${X(i)}" cy="${Y(x[1])}" r="2.5" fill="${col}"/>`;
      g+=`<circle cx="${X(i)}" cy="${Y(x[0])}" r="5" fill="${col}" stroke="var(--bg)" stroke-width="1.5"/>`; });
  });
  return `<div class="kpi"><div><b>${Math.round(onTime/all.length*100)}%</b><span>posiłków zapisanych na bieżąco</span></div><div><b>${lagAvg.toFixed(1).replace('.',',')} h</b><span>średnio od jedzenia do zapisu</span></div><div><b>${late}</b><span>posiłki po 21:00 w tym tygodniu</span></div></div>
    <div class="card"><div class="sec">Kiedy jesz i kiedy zapisujesz · ostatnie 7 dni</div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Godziny posiłków i zapisów w ostatnim tygodniu">${g}</svg></div>
      <div class="legend"><span><i style="background:var(--green)"></i>na bieżąco</span><span><i style="background:var(--gold)"></i>później</span><span><i style="background:var(--red)"></i>dopiero wieczorem</span><span>kropka = posiłek, mała kropka = zapis</span></div></div>
    <div class="card"><div class="sec">Co z tego wynika</div>
      <div class="insight"><b>Wtorek i weekend zapisujesz wieczorem</b> — w te dni jesz też najpóźniej. Spróbuj zapisywać od razu, choćby zdjęciem.</div>
      <div class="insight"><b>Przekąska znika od piątku</b> — a w piątek i sobotę kolacja po 22:00. Długa przerwa po obiedzie często kończy się dużym, późnym posiłkiem.</div>
      <div class="insight"><b>Pn, Śr i Nd: pełny dzień na bieżąco.</b> Tak wygląda Twój dobry dzień — 3 z 7. Cel na ten tydzień: 4.</div></div>`;
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>{ b.classList.toggle('on',b.dataset.tab===tab); b.setAttribute('aria-selected',b.dataset.tab===tab); });
  document.getElementById('view').innerHTML=tab==='day'?viewDay():tab==='photo'?viewPhoto():tab==='eve'?viewEve():viewStats();
  const cv=document.getElementById('cv'); if(cv) drawPlate(cv);
  bind();
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',3000); }
function startPhoto(url){ photoUrl=url; photoStage='busy'; render(); setTimeout(()=>{ items=SAMPLE.map(x=>Object.assign({g0:x.g},x)); photoStage='done'; render(); }, 1600); }
function bind(){
  const v=document.getElementById('view');
  v.querySelectorAll('[data-tab2]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab2; render(); });
  v.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{ const k=b.dataset.meal, s=SLOTS.find(x=>x.k===k);
    if(DAY[k]){ delete DAY[k]; askFor=null; render(); return; }
    if(NOW-s.usual>45){ askFor=k; render(); return; }
    DAY[k]={logged:NOW, ate:NOW}; render(); });
  v.querySelectorAll('[data-ate]').forEach(b=>b.onclick=()=>{ DAY[askFor]={logged:NOW, ate:+b.dataset.ate}; askFor=null; render(); });
  v.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{ const s=SLOTS.find(x=>x.k===b.dataset.quick); DAY[s.k]={logged:NOW, ate:s.usual}; render(); toast(s.t+' zapisany wg planu'); });
  const sn=v.querySelector('[data-snooze]'); if(sn) sn.onclick=()=>toast('Przypomnę za 30 minut');
  const pic=document.getElementById('pic'); if(pic) pic.onchange=()=>{ const f=pic.files&&pic.files[0]; if(f) startPhoto(URL.createObjectURL(f)); };
  const sm=document.getElementById('sample'); if(sm) sm.onclick=()=>startPhoto(null);
  v.querySelectorAll('[data-it]').forEach(r=>r.oninput=()=>{ items[+r.dataset.it].g=+r.value; const y=window.scrollY; render(); window.scrollTo(0,y); const n=document.querySelector(`[data-it="${r.dataset.it}"]`); if(n) n.focus(); });
  const us=document.getElementById('use'); if(us) us.onclick=()=>{ const s=photoSum(); DAY.extra.push({d:'Makaron z sosem mięsnym i parmezanem', kcal:Math.round(s.kcal), p:Math.round(s.p), c:Math.round(s.c), f:Math.round(s.f), logged:NOW, ate:NOW}); photoStage='pick'; photoUrl=null; tab='day'; render(); toast('Dodano do dnia'); };
  const ag=document.getElementById('again'); if(ag) ag.onclick=()=>{ photoStage='pick'; photoUrl=null; render(); };
  v.querySelectorAll('[data-eve]').forEach(b=>b.onclick=()=>{ eve[b.dataset.eve]=b.dataset.o; render(); });
  const ed=document.getElementById('eveDone'); if(ed) ed.onclick=()=>{ if(EVE_MISSING.every(k=>eve[k])) toast('Dzień domknięty · 2 posiłki uzupełnione wieczorem'); };
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });
render();
</script>

</body></html>
