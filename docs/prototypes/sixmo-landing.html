<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SixMo — strona startowa (prototyp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Prototyp strony startowej sixmo.app (aplikacja: app.sixmo.app). Działa na telefonie i komputerze, przełącznik PL/EN.
   Ceny i opinie — przykładowe, do ustalenia. */
:root{
  --bg:#0e1114; --panel:#171b1f; --panel2:#1e2429; --line:#2a3138;
  --ink:#f2f0ea; --dim:#9aa3ab; --faint:#8a949c;
  --amber:#ff7a1a; --amber-soft:#3a2410; --steel:#5fa8d3; --green:#4ec97e;
  --ph1:#7fb2ff; --ph2:#b79cff; --ph3:#ffc24b;
  --disp:'Barlow Condensed',sans-serif; --body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
.disp{font-family:var(--disp);font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:.01em}

/* nagłówek */
header{position:sticky;top:0;z-index:10;background:rgba(14,17,20,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:26px;text-decoration:none}
.logo b{color:var(--amber)}
nav.top{display:flex;align-items:center;gap:22px;font-size:14.5px;color:var(--dim)}
nav.top a{text-decoration:none}nav.top a:hover{color:var(--ink)}
@media(max-width:820px){nav.top .hide-m{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12.5px;font-weight:600}
.lang button{padding:5px 10px;color:var(--faint)}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--amber);color:#0e1114}
.btn.sec{border:1px solid var(--line);background:var(--panel)}
.btn.sm{height:38px;padding:0 14px;border-radius:11px;font-size:14px}

/* hero */
.hero{padding:64px 0 40px}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:860px){.hero .w{grid-template-columns:1fr}.hero{padding-top:36px}}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.hero h1{font-size:clamp(48px,8vw,88px);margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p.sub{font-size:clamp(17px,2vw,19px);color:var(--dim);max-width:520px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 14px}
.trust{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--faint)}
.trust span::before{content:'✓ ';color:var(--green)}

/* telefon z ekranem aplikacji */
.mock{justify-self:center;width:300px;max-width:100%;border-radius:38px;border:1px solid var(--line);background:#0b0e11;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 6px #141a1f}
.mock .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--disp);font-weight:700;font-size:19px}
.mock .bar b{color:var(--amber)}
.mock .chipx{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--dim);font-family:var(--body);font-weight:600}
.mock .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.mock .t{font-family:var(--disp);font-weight:700;font-size:24px;text-transform:uppercase;margin:2px 0 10px}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.mac div{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 2px;text-align:center;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.mac b{display:block;font-family:var(--disp);font-size:19px;color:var(--ink);letter-spacing:0}
.mac div:first-child b{color:var(--amber)}
.meal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:12.5px}
.meal b{display:block;font-family:var(--disp);color:var(--amber);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.meal.done{opacity:.6}
.coachb{background:var(--panel2);border-radius:12px 12px 12px 4px;padding:9px 11px;font-size:12.5px;color:var(--dim);margin-top:8px}
.coachb b{color:var(--ink)}

section{padding:64px 0}
section h2{font-size:clamp(34px,5vw,52px);margin-bottom:10px}
section .intro{color:var(--dim);max-width:620px;margin-bottom:30px;font-size:17px}

/* fazy */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.phases{grid-template-columns:1fr}}
.ph{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.ph::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ph .n{font-family:var(--disp);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.ph h3{font-family:var(--disp);font-size:30px;text-transform:uppercase;margin:4px 0 6px}
.ph p{color:var(--dim);font-size:14.5px}
.track{display:flex;gap:6px;margin-top:18px}
.track i{flex:1;height:8px;border-radius:4px;background:var(--c)}

/* funkcje */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.feat{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.feat{grid-template-columns:1fr}}
.f{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.f .ic{width:42px;height:42px;border-radius:12px;background:var(--amber-soft);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.f h3{font-size:17px;margin-bottom:4px}
.f p{color:var(--dim);font-size:14.5px}

/* kroki */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.st{border-top:2px solid var(--line);padding-top:16px}
.st::before{counter-increment:s;content:counter(s);font-family:var(--disp);font-weight:700;font-size:44px;color:var(--amber);line-height:1}
.st h3{font-size:17px;margin:6px 0 4px}.st p{color:var(--dim);font-size:14.5px}

/* cennik */
.price{display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:14px;justify-content:center}
@media(max-width:760px){.price{grid-template-columns:1fr}}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column}
.pl.best{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.pl .nm{font-family:var(--disp);font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.pl .pr{font-family:var(--disp);font-weight:700;font-size:48px;margin:6px 0}
.pl .pr small{font-size:18px;color:var(--faint);font-weight:500}
.pl ul{list-style:none;margin:10px 0 20px;flex:1}
.pl li{padding:6px 0;color:var(--dim);font-size:14.5px;border-bottom:1px solid var(--line)}
.pl li::before{content:'✓  ';color:var(--green)}
.pl .tagb{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:#0e1114;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.pnote{text-align:center;color:var(--faint);font-size:13px;margin-top:14px}

/* FAQ */
details{border-bottom:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;font-weight:600;font-size:16.5px;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:'+';color:var(--amber);font-size:22px;line-height:1}
details[open] summary::after{content:'–'}
details p{color:var(--dim);margin-top:8px;max-width:760px}

.final{text-align:center;background:linear-gradient(180deg,var(--bg),#151a1f);border-top:1px solid var(--line)}
.final h2{margin-bottom:12px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--faint);font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
</style>
</head><body>

<header><div class="w">
  <a class="logo" href="#"><svg width="30" height="30" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke-width="16" stroke-linecap="round"><path d="M109.7 25.6L159.6 54.4" stroke="#f2f0ea"/><path d="M169.3 71.2L169.3 128.8" stroke="#f2f0ea"/><path d="M159.6 145.6L109.7 174.4" stroke="#f2f0ea"/><path d="M90.3 174.4L40.4 145.6" stroke="#f2f0ea"/><path d="M30.7 128.8L30.7 71.2" stroke="#f2f0ea"/><path d="M40.4 54.4L90.3 25.6" stroke="#ff7a1a"/></g><text x="100" y="133" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="92" fill="#f2f0ea">6</text></svg><span>Six<b>Mo</b></span></a>
  <nav class="top">

  </nav>
</div></header>

<main>
<div class="hero"><div class="w">
  <div>
    <div class="eyebrow" data-t="eyebrow"></div>

    <p class="sub" data-t="sub"></p>
    <div class="cta"><a class="btn pri" href="#" data-t="start"></a><a class="btn sec" href="#plan" data-t="how"></a></div>
    <div class="trust"><span data-t="tr1"></span><span data-t="tr2"></span><span data-t="tr3"></span></div>
  </div>
  <div class="mock" aria-hidden="true">
    <div class="bar"><span>Six<b>Mo</b></span><span class="chipx" data-t="mStreak"></span></div>

    <div class="t" data-t="mT"></div>

  </div>
</div></div>

<section id="plan"><div class="w">
  <h2 class="disp" data-t="planH"></h2>

  <div class="phases">
    <div class="ph" style="--c:var(--ph1)"><div class="n" data-t="p1n"></div><h3 data-t="p1h"></h3><p data-t="p1p"></p><div class="track"><i></i><i></i><i style="opacity:.25"></i><i style="opacity:.25"></i><i style="opacity:.25"></i><i style="opacity:.25"></i></div></div>
    <div class="ph" style="--c:var(--ph2)"><div class="n" data-t="p2n"></div><h3 data-t="p2h"></h3><p data-t="p2p"></p><div class="track"><i style="opacity:.25"></i><i style="opacity:.25"></i><i></i><i></i><i style="opacity:.25"></i><i style="opacity:.25"></i></div></div>

  </div>
</div></section>

<section id="funkcje" style="background:#12161a;border-block:1px solid var(--line)"><div class="w">
  <h2 class="disp" data-t="featH"></h2>
  <p class="intro" data-t="featP"></p>
  <div class="feat">
    <div class="f"><div class="ic">🍽️</div><h3 data-t="f1h"></h3><p data-t="f1p"></p></div>
    <div class="f"><div class="ic">🏋️</div><h3 data-t="f2h"></h3><p data-t="f2p"></p></div>

    <div class="f"><div class="ic">📷</div><h3 data-t="f4h"></h3><p data-t="f4p"></p></div>
    <div class="f"><div class="ic">🧍</div><h3 data-t="f5h"></h3><p data-t="f5p"></p></div>
    <div class="f"><div class="ic">📶</div><h3 data-t="f6h"></h3><p data-t="f6p"></p></div>
  </div>
</div></section>

<section><div class="w">
  <h2 class="disp" data-t="stepsH"></h2>
  <div class="steps" style="margin-top:24px">
    <div class="st"><h3 data-t="s1h"></h3><p data-t="s1p"></p></div>
    <div class="st"><h3 data-t="s2h"></h3><p data-t="s2p"></p></div>
    <div class="st"><h3 data-t="s3h"></h3><p data-t="s3p"></p></div>
  </div>
</div></section>

<section id="cennik" style="background:#12161a;border-block:1px solid var(--line)"><div class="w">
  <h2 class="disp" data-t="priceH" style="text-align:center"></h2>
  <p class="intro" data-t="priceP" style="text-align:center;margin-inline:auto"></p>
  <div class="price">
    <div class="pl"><div class="nm" data-t="free"></div><div class="pr">0 zł</div><ul><li data-t="fr1"></li><li data-t="fr2"></li><li data-t="fr3"></li><li data-t="fr4"></li></ul><a class="btn sec" href="#" data-t="start"></a></div>
    <div class="pl best"><span class="tagb" data-t="popular"></span><div class="nm">Premium</div><div class="pr">—<small data-t="perMo"></small></div><ul><li data-t="pr1"></li><li data-t="pr2"></li><li data-t="pr3"></li><li data-t="pr4"></li></ul><a class="btn pri" href="#" data-t="tryPrem"></a></div>
  </div>

<section><div class="w" style="max-width:860px">
  <h2 class="disp" data-t="faqH"></h2>
  <details><summary data-t="q1"></summary><p data-t="a1"></p></details>

  <details><summary data-t="q3"></summary><p data-t="a3"></p></details>
  <details><summary data-t="q4"></summary><p data-t="a4"></p></details>
