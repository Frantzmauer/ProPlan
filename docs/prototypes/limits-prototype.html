<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Limity Trenera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1114; --panel:#171b1f; --panel2:#1e2429; --line:#2a3138;
  --ink:#f2f0ea; --ink-dim:#9aa3ab; --ink-faint:#8a949c;
  --amber:#ff7a1a; --amber-soft:#3a2410; --steel:#5fa8d3; --green:#4ec97e; --red:#e2543a;
  --font-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:440px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;font-weight:600}
h2{font-family:var(--font-disp);text-transform:uppercase;line-height:1.05;margin:0}
.proto{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.proto button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-dim);min-height:40px}
.proto button.on{background:var(--amber);border-color:var(--amber);color:#0e1114}
.pnote{font-size:13px;color:var(--ink-dim);border-left:3px solid var(--steel);padding:6px 10px;margin:10px 0 14px;background:rgba(95,168,211,.07);border-radius:0 8px 8px 0}
.pnote b{color:var(--ink)}
.screen[hidden]{display:none}
/* czat Trenera */
.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;height:min(640px,78vh);overflow:hidden}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch-head h2{font-size:24px}
.quota{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.quota.low{color:var(--amber);border-color:rgba(255,122,26,.5)}
.quota.out{color:var(--red);border-color:rgba(226,84,58,.5)}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.b.me{align-self:flex-end;background:var(--amber-soft);border-color:rgba(255,122,26,.35)}
.b small{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.b.sys{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--ink-dim);font-size:12.5px;text-align:center;max-width:100%}
.limit{margin:0 14px 10px;background:rgba(226,84,58,.08);border:1px solid rgba(226,84,58,.45);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.limit b{color:var(--ink)}
.limit button{align-self:flex-start;min-height:40px;padding:0 14px;border-radius:10px;background:var(--amber);color:#0e1114;font-weight:700;font-size:13.5px}
.compose{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink)}
.row input:focus{outline:none;border-color:var(--amber)}
.row input:disabled{opacity:.5}
.ico{width:46px;height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:19px;flex:none}
.send{width:46px;height:46px;border-radius:12px;background:var(--amber);color:#0e1114;font-weight:700;font-size:20px;flex:none}
.send:disabled,.ico:disabled{opacity:.4}
.hint{font-size:12px;color:var(--ink-faint)}
/* okno głosu */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.mc{width:100%;max-width:480px;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.mc h3{font-family:var(--font-disp);font-size:24px;text-transform:uppercase;margin:0}
.mc p{margin:0;font-size:14px;color:var(--ink-dim)}
.mc p b{color:var(--ink)}
.go{min-height:52px;border-radius:14px;background:var(--amber);color:#0e1114;font-family:var(--font-disp);font-weight:700;font-size:20px;letter-spacing:.04em}
.alt{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
/* Więcej */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .t{display:flex;justify-content:space-between;font-size:14px}
.meter .t b{font-family:var(--font-disp);font-size:18px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--amber)}
.bar span.full{background:var(--red)}
.small{font-size:12.5px;color:var(--ink-faint)}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.plan b{font-size:15px}
.plan small{display:block;color:var(--ink-dim);font-size:12.5px}
.tag{font-size:11px;font-weight:700;color:#0e1114;background:var(--amber);border-radius:5px;padding:2px 7px;white-space:nowrap}
</style>

<div class="wrap">
  <div class="eyebrow">Prototyp · Limity Trenera AI</div>
  <div class="proto" id="scr"><button data-scr="chat" class="on">Czat z Trenerem</button><button data-scr="more">Więcej → Twój plan</button></div>
  <div class="proto" id="scen">
    <button data-scen="prem" class="on">Premium · 18/30</button>
    <button data-scen="last">Premium · ostatnie</button>
    <button data-scen="out">Limit wykorzystany</button>
    <button data-scen="free">Darmowy · 5</button>
  </div>
  <div class="pnote" id="note"></div>
  <section class="screen" id="s-chat"><div class="chat" id="chat"></div></section>
  <section class="screen" id="s-more" hidden><div class="panel" id="more"></div></section>
</div>
<div class="modal" id="voice" hidden><div class="mc" role="dialog" aria-modal="true" aria-labelledby="vT">
  <h3 id="vT">Rozmowa głosowa</h3>
  <p>Każda Twoja wypowiedź to <b>1 pytanie</b> z limitu. Zostało Ci <b id="vLeft"></b>.</p>
  <p>Wskazówka: powiedz całe pytanie naraz, np. „Bolą mnie kolana przy przysiadzie, co zmienić w treningu i ile ciężaru?”.</p>
  <button class="go" data-vok>Mów</button><button class="alt" data-vno>Wolę napisać</button>
  <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="vMute"> Nie pokazuj więcej</label>
</div></div>

<script>
// pytania do Trenera: 30 (Premium) / 5 (darmowy) miesięcznie; krótkie podziękowania bez AI i bez limitu
const SHORT=/^\s*(dzięki|dziekuje|dziękuję|dzieki|thx|ok|okej|okay|super|spoko|jasne|git|👍|💪|🙏)[\s!.]*$/i;
const LOCAL=['Do usług 💪','Powodzenia na treningu!','Jasne — pisz, gdy coś będzie potrzebne.'];
let st={plan:'prem', max:30, used:12, rec:3, recMax:10, est:23, voiceAsked:false, msgs:[]};
function scen(k){
  st.msgs=[{me:false, t:'Cześć! W czym mogę pomóc?'}];
  if(k==='prem') Object.assign(st,{plan:'prem',max:30,used:12,rec:3,recMax:10});
  if(k==='last') Object.assign(st,{plan:'prem',max:30,used:29,rec:9,recMax:10});
  if(k==='out')  Object.assign(st,{plan:'prem',max:30,used:30,rec:10,recMax:10});
  if(k==='free') Object.assign(st,{plan:'free',max:5,used:2,rec:0,recMax:1});
}
const left=()=>Math.max(0, st.max-st.used);
const RESET='1 grudnia';
function quota(){ const l=left(); return `<span class="quota ${l===0?'out':l<=3?'low':''}" title="Pytania do Trenera w tym miesiącu">💬 ${l} z ${st.max}</span>`; }
function renderChat(){
  const l=left(), out=l===0;
  document.getElementById('chat').innerHTML=`<div class="ch-head"><h2>Trener</h2>${quota()}</div>
    <div class="msgs" id="msgs">${st.msgs.map(m=>`<div class="b ${m.sys?'sys':m.me?'me':''}">${m.t}${m.note?`<small>${m.note}</small>`:''}</div>`).join('')}</div>
    ${out?`<div class="limit"><span><b>Limit ${st.max} pytań na listopad wykorzystany.</b> Nowe pytania od ${RESET}. ${st.plan==='free'?'W Premium masz 30 pytań i 10 ocen techniki miesięcznie.':'Plan, check-in, przerwy i szacowanie kalorii działają dalej bez limitu.'}</span><button>${st.plan==='free'?'Przejdź na Premium · 29,99 zł':'Dokup 20 pytań · 4,99 zł'}</button></div>`:''}
    <div class="compose"><div class="row"><button class="ico" data-mic aria-label="Rozmowa głosowa" ${out?'disabled':''}>🎤</button><input id="inp" placeholder="${out?'Limit pytań wykorzystany':'Zadaj całe pytanie naraz…'}" ${out?'disabled':''} aria-label="Pytanie do Trenera"><button class="send" data-send aria-label="Wyślij" ${out?'disabled':''}>↑</button></div>
      <div class="hint">${out?'Krótkie „dzięki” czy „ok” nadal możesz napisać — nie liczą się do limitu.':l<=3?`Zostały ${l} ${l===1?'pytanie':'pytania'} do ${RESET}. „Dzięki”, „ok” nie liczą się do limitu.`:'1 wiadomość = 1 pytanie. „Dzięki”, „ok” nie liczą się do limitu.'}</div></div>`;
  const m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight;
  const inp=document.getElementById('inp'); inp.onkeydown=e=>{ if(e.key==='Enter') send(); };
}
function send(){
  const inp=document.getElementById('inp'), t=(inp.value||'').trim(); if(!t) return;
  st.msgs.push({me:true, t});
  if(SHORT.test(t)) st.msgs.push({me:false, t:LOCAL[Math.floor(Math.random()*LOCAL.length)], note:'bez AI · nie liczy się do limitu'});
  else if(left()===0) st.msgs.push({sys:true, t:'Limit pytań wykorzystany — nowe od '+RESET+'.'});
  else { st.used++; st.msgs.push({me:false, t:'(odpowiedź Trenera AI na Twoje pytanie)', note:'−1 pytanie · zostało '+left()}); }
  renderChat();
}
function renderMore(){
  const pct=(a,b)=>Math.min(100,Math.round(a/b*100));
  document.getElementById('more').innerHTML=`<div class="eyebrow">Twój plan · listopad</div>
    <div class="plan"><div><b>${st.plan==='prem'?'Premium':'Darmowy'}</b><small>${st.plan==='prem'?'29,99 zł / mies. · odnawia się '+RESET:'Limity odnawiają się '+RESET}</small></div>${st.plan==='free'?'<span class="tag">PREMIUM 29,99 ZŁ</span>':''}</div>
    <div class="meter"><div class="t"><span>Pytania do Trenera</span><b>${st.used} / ${st.max}</b></div><div class="bar"><span class="${left()===0?'full':''}" style="width:${pct(st.used,st.max)}%"></span></div></div>
    <div class="meter"><div class="t"><span>Oceny techniki z nagrania</span><b>${st.rec} / ${st.recMax}</b></div><div class="bar"><span class="${st.rec>=st.recMax?'full':''}" style="width:${pct(st.rec,st.recMax)}%"></span></div></div>
    <div class="meter"><div class="t"><span>Szacowanie kalorii posiłków</span><b>${st.est} · bez limitu</b></div><div class="small">Tańszy model, osobny limit dzienny 40 — nie zjada pytań do Trenera.</div></div>
    <div class="small">Bez limitu: plan treningu i diety, tryb treningu, rekordy, przerwy, check-in, cykl, offline. „Dzięki”, „ok” do Trenera nie liczą się do limitu.</div>`;
}
function note(){
  const s=document.querySelector('#scr .on').dataset.scr;
  document.getElementById('note').innerHTML = s==='chat'
    ? '<b>Spróbuj:</b> napisz „dzięki” (licznik się nie zmienia), potem prawdziwe pytanie (−1). Stuknij 🎤 — przed rozmową głosową pojawi się informacja o liczeniu. Zmieniaj scenariusze u góry.'
    : '<b>Więcej → Twój plan:</b> ile zostało pytań i ocen techniki, kiedy się odnawia, co jest bez limitu.';
}
function render(){ renderChat(); renderMore(); note(); }
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-scr],[data-scen],[data-send],[data-mic],[data-vok],[data-vno]'); if(!t) return;
  const d=t.dataset;
  if(d.scr){ document.querySelectorAll('#scr button').forEach(b=>b.classList.toggle('on',b===t)); ['chat','more'].forEach(k=>document.getElementById('s-'+k).hidden=k!==d.scr); render(); }
  else if(d.scen){ document.querySelectorAll('#scen button').forEach(b=>b.classList.toggle('on',b===t)); scen(d.scen); render(); }
  else if('send' in d) send();
  else if('mic' in d){ if(st.voiceAsked){ st.msgs.push({sys:true,t:'🎤 Słucham… (każda wypowiedź = 1 pytanie)'}); renderChat(); return; } document.getElementById('vLeft').textContent=left()+' z '+st.max; document.getElementById('voice').hidden=false; }
  else if('vok' in d){ if(document.getElementById('vMute').checked) st.voiceAsked=true; document.getElementById('voice').hidden=true; st.msgs.push({sys:true,t:'🎤 Słucham… (każda wypowiedź = 1 pytanie)'}); renderChat(); }
  else if('vno' in d){ document.getElementById('voice').hidden=true; document.getElementById('inp').focus(); }
});
scen('prem'); render();
</script>

</body></html>
