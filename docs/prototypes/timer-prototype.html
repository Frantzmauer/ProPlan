<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Timer ćwiczeń ŻELAZO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1114; --panel:#171b1f; --panel2:#1e2429; --line:#2a3138;
  --ink:#f2f0ea; --ink-dim:#9aa3ab; --ink-faint:#5f6a72;
  --amber:#ff7a1a; --amber-soft:#3a2410; --steel:#5fa8d3; --green:#4ec97e; --red:#e2543a;
  --r:14px;
  --font-disp:'Barlow Condensed',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  color-scheme:dark; /* aplikacja ŻELAZO jest tylko ciemna */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ .tmr.end{animation:none} .tmr .bar{transition:none} }
.proto-note{font-size:12.5px;color:var(--ink-dim);margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.show-btn{background:var(--panel2);border:1px solid var(--line);color:var(--steel);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:7px;white-space:nowrap}
.ex{border-bottom:1px solid var(--line);padding:13px 16px}
.ex:last-child{border-bottom:none}
.ex-top{display:flex;gap:12px;align-items:center}
.ex-top .num{font-family:var(--font-disp);font-size:15px;font-weight:700;color:var(--ink-faint);width:20px;flex:none}
.ex-top .nm{flex:1;font-size:15px;font-weight:500}
.ex-top .scheme{font-size:12.5px;color:var(--ink-dim);font-family:var(--font-disp);letter-spacing:.03em;font-weight:600;white-space:nowrap}
.ex-sub{margin-left:32px;font-size:12px;color:var(--ink-dim);margin-top:2px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px 32px}
.set{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;transition:border-color .2s,background .2s}
.set.filled{border-color:#2f5a3f;background:#18251d}
.set.cur{border-color:var(--amber)}
.set .si{font-family:var(--font-disp);font-weight:700;color:var(--ink-faint);font-size:13px;width:14px;text-align:center}
.set input{width:42px;background:transparent;border:none;color:var(--ink);font-size:14px;text-align:center;font-family:var(--font-disp);font-weight:600;padding:2px 0}
.set input:focus{outline:none}
.set .u{color:var(--ink-faint);font-size:10px}
.ex-check{margin-left:32px;margin-top:9px;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim)}
.mini{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--panel2)}

/* ---- timer ---- */
.tmr{margin:10px 0 2px 32px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;transition:border-color .2s}
.tmr .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0;transition:width .25s linear}
.tmr.run{border-color:var(--amber)}
.tmr.end{border-color:var(--green)}
.tmr.end .bar{background:var(--green)}
.tmr .go{width:64px;height:64px;border-radius:50%;background:var(--amber);color:#0e1114;display:grid;place-items:center;flex:none;transition:transform .1s}
.tmr .go:active{transform:scale(.93)}
.tmr .go svg{width:28px;height:28px;fill:#0e1114}
.tmr.run .go{background:var(--ink)}
.tmr .mid{flex:1;min-width:0}
.tmr .time{font-family:var(--font-disp);font-weight:700;font-size:44px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tmr.run .time{color:var(--amber)}
.tmr.end .time{color:var(--green)}
.tmr .lbl{font-size:12px;color:var(--ink-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr .rst{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink-dim)}
.tmr .rst:active{transform:scale(.93)}
.tmr .rst svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes flash{0%,100%{background:var(--panel2)}50%{background:#1c3325}}
.tmr.end{animation:flash .5s 3}
@media (max-width:380px){ .tmr{margin-left:0} .sets,.ex-sub,.ex-check{margin-left:0} }
</style>
<div class="wrap">
  <p class="proto-note">Prototyp timera. Zielone pola serii wypełniają się same po każdym odliczeniu.</p>
  <div class="card" id="card"></div>
</div>

<script>
const EX=[
  {n:"Farmer walk z hantlami",s:3,r:"40 s",start:"najcięższe hantle, jakie masz",rp:40},
  {n:"Deska (plank)",s:3,r:"max czas",start:"masa ciała",rp:60},
  {n:"Deska boczna",s:2,r:"30 s/stronę",start:"masa ciała",rp:30},
];

// czas z opisu: "40 s" → 40, "30 s/stronę" → 30 ×2 strony, "max czas" → stoper w górę
function timedSpec(e){
  const m=/(\d+)\s*s\b/.exec(e.r);
  if(m) return {secs:+m[1], sides:/stron/.test(e.r)?2:1, up:false};
  if(/czas/.test(e.r)) return {secs:0, sides:1, up:true};
  return null;
}
const fmt=t=>{t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
const RESET='<svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v5h5"/></svg>';

let audio;
function beep(f,d){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=f; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.25,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d); o.start(); o.stop(audio.currentTime+d);}catch(e){} }
function buzz(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }

function render(){
  const card=document.getElementById('card');
  card.innerHTML=EX.map((e,i)=>{
    const sp=timedSpec(e);
    let sets='';
    for(let s=1;s<=e.s;s++) sets+=`<div class="set" data-set="${s}"><span class="si">${s}</span><input type="number" inputmode="numeric" placeholder="s" value=""><span class="u">s</span></div>`;
    return `<div class="ex" data-i="${i}">
      <div class="ex-top"><span class="num">${i+1}</span><span class="nm">${e.n}</span><button class="show-btn">Pokaż</button><span class="scheme">${e.s}×${e.r}</span></div>
      <div class="ex-sub">Start: ${e.start}</div>
      ${sp?`<div class="tmr"><button class="go" aria-label="Start">${PLAY}</button>
        <div class="mid"><div class="time">${fmt(sp.secs)}</div><div class="lbl"></div></div>
        <button class="rst" aria-label="Reset">${RESET}</button><div class="bar"></div></div>`:''}
      <div class="sets">${sets}</div>
      <div class="ex-check"><span class="mini"></span><span>Odznacz ćwiczenie</span></div>
    </div>`;
  }).join('');
  card.querySelectorAll('.ex').forEach(el=>bindTimer(el, EX[+el.dataset.i]));
}

function bindTimer(exEl, e){
  const sp=timedSpec(e); if(!sp) return;
  const box=exEl.querySelector('.tmr'), go=box.querySelector('.go'), rst=box.querySelector('.rst'),
        time=box.querySelector('.time'), lbl=box.querySelector('.lbl'), bar=box.querySelector('.bar');
  const sets=[...exEl.querySelectorAll('.set')];
  let set=1, side=1, left=sp.secs, el=0, run=false, endAt=0, startAt=0, tick=null;

  function label(){
    if(set>e.s) return 'Wszystkie serie zrobione 💪';
    let t=`Seria ${set} z ${e.s}`;
    if(sp.sides>1) t+=side===1?' · lewa strona':' · prawa strona';
    if(sp.up) t+=' · trzymaj ile dasz radę';
    return t;
  }
  function paint(){
    time.textContent = sp.up ? fmt(el) : fmt(left);
    lbl.textContent = label();
    bar.style.width = sp.up ? '0' : ((1-left/sp.secs)*100)+'%';
    go.innerHTML = run?PAUSE:PLAY;
    go.setAttribute('aria-label', run?'Pauza':'Start');
    box.classList.toggle('run', run);
    sets.forEach((s,k)=>s.classList.toggle('cur', k+1===set && set<=e.s));
  }
  function fillSet(v){
    const s=sets[set-1]; if(!s) return;
    s.querySelector('input').value=v; s.classList.add('filled');
  }
  function finishSegment(){
    run=false; clearInterval(tick);
    beep(880,.35); setTimeout(()=>beep(1175,.5),180); buzz([200,100,200]);
    box.classList.remove('end'); void box.offsetWidth; box.classList.add('end');
    if(sp.up){ fillSet(Math.round(el)); set++; el=0; }
    else if(sp.sides>1 && side===1){ side=2; }
    else { fillSet(sp.secs); set++; side=1; }
    left=sp.secs;
    paint();
  }
  function step(){
    const now=performance.now();
    if(sp.up){ el=(now-startAt)/1000; }
    else{
      const prev=Math.ceil(left);
      left=(endAt-now)/1000;
      if(Math.ceil(left)!==prev && left>0 && left<=3) beep(660,.12); // 3-2-1
      if(left<=0){ left=0; finishSegment(); return; }
    }
    paint();
  }
  go.onclick=()=>{
    if(set>e.s){ set=1; side=1; left=sp.secs; el=0; sets.forEach(s=>{s.classList.remove('filled');s.querySelector('input').value='';}); }
    if(run){ // pauza
      run=false; clearInterval(tick);
      if(sp.up) finishSegment(); // stoper: pauza = koniec serii, zapisz czas
    } else {
      run=true; box.classList.remove('end');
      endAt=performance.now()+left*1000; startAt=performance.now()-el*1000;
      tick=setInterval(step,100); buzz(30);
    }
    paint();
  };
  rst.onclick=()=>{ run=false; clearInterval(tick); left=sp.secs; el=0; box.classList.remove('end'); paint(); };
  paint();
}
render();
</script>

</body></html>
